# PSX: server ponte per il VERSUS quando il collegamento diretto non riesce (5G, CGNAT)
listening-port=3478
listening-ip=0.0.0.0
external-ip=YOUR_SERVER_IP
relay-ip=YOUR_SERVER_IP
min-port=49160
max-port=49250
realm=psxsol0lev.xyz
fingerprint
use-auth-secret
static-auth-secret=<SEGRETO in /etc/psx/turn.env, mai nel repo>
stale-nonce=600
# limiti: 25 sessioni in tutto, 5 Mbit/s ciascuna
total-quota=120
user-quota=6
max-bps=5000000
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
simple-log
syslog
# mai verso reti interne o speciali (niente uso del ponte per entrare nel server o in altre reti private)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
secure-stun
no-tcp-relay
no-loopback-peers
max-allocate-lifetime=7200
channel-lifetime=600
permission-lifetime=300
