<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PSX card</title>
<!-- Sorgente dell'immagine di anteprima del post (card.png, 1200x1200). Si rigenera con: npm run card -->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,700&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; background: #05060f; }
  body { font-family: 'VT323', monospace; color: #e9ecff; position: relative;
    background: linear-gradient(180deg, #0a0d2e 0%, #1b1060 55%, #3a0f5a 100%); }
  .floor { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 55%; transform: perspective(500px) rotateX(62deg); transform-origin: bottom;
    background-image: linear-gradient(rgba(255,111,181,.55) 3px, transparent 3px), linear-gradient(90deg, rgba(47,124,246,.55) 3px, transparent 3px);
    background-size: 90px 90px; -webkit-mask-image: linear-gradient(transparent, #000 40%); }
  .stars { position: absolute; inset: 0 0 50% 0; background-image:
    radial-gradient(3px 3px at 12% 20%, #fff, transparent), radial-gradient(2px 2px at 30% 60%, #fff, transparent),
    radial-gradient(3px 3px at 55% 12%, #fff, transparent), radial-gradient(2px 2px at 72% 42%, #fff, transparent),
    radial-gradient(3px 3px at 88% 24%, #fff, transparent), radial-gradient(2px 2px at 42% 32%, #fff, transparent),
    radial-gradient(2px 2px at 8% 70%, #fff, transparent), radial-gradient(3px 3px at 93% 65%, #fff, transparent); }
  .logo { position: absolute; top: 90px; width: 100%; text-align: center; font-family: 'Chakra Petch', sans-serif; font-style: italic; font-weight: 700; font-size: 190px; letter-spacing: .04em; }
  .tw { background: linear-gradient(180deg, #fff 0%, #c9cfe6 45%, #6d7494 52%, #e2e6f7 100%); -webkit-background-clip: text; color: transparent; }
  .st { background: linear-gradient(90deg, #e8402a, #f5c400, #2bbf6a, #2f7cf6); -webkit-background-clip: text; color: transparent; }
  .sub { position: absolute; top: 320px; width: 100%; text-align: center; font-size: 54px; letter-spacing: .3em; color: #b8bde0; }
  .discs { position: absolute; top: 430px; width: 100%; display: flex; justify-content: center; gap: 40px; }
  .disc { width: 300px; height: 300px; border-radius: 50%; position: relative;
    background: radial-gradient(circle, #05060f 0 7%, #9aa3c4 7.5% 8.5%, transparent 9%),
      conic-gradient(from 0deg, #d8dcef, #ff9ecf, #a1f0ff, #fff6a8, #b6ffb9, #d8dcef 50%, #ff9ecf, #a1f0ff, #fff6a8, #d8dcef);
    box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 24px 50px rgba(0,0,0,.6); }
  .disc::after { content: ''; position: absolute; inset: 17%; border-radius: 50%;
    background: radial-gradient(circle, transparent 0 22%, var(--c) 22.5%); }
  .disc:nth-child(2) { transform: translateY(-30px) scale(1.12); z-index: 2; }
  .press { position: absolute; bottom: 150px; width: 100%; text-align: center; font-size: 76px; letter-spacing: .14em; text-shadow: 0 0 18px rgba(47,124,246,.9); }
  .x { display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: #14162a; box-shadow: 0 0 0 3px #3a3e5a;
    color: #7fb2ff; font-family: system-ui, sans-serif; font-weight: 700; font-size: 52px; vertical-align: middle; margin: 0 10px; }
  .crt { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 5px),
    radial-gradient(120% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%); }
</style>
</head>
<body>
  <div class="stars"></div><div class="floor"></div>
  <div class="logo"><span class="st">PS</span><span class="tw">X</span></div>
  <div class="sub">A PS1 IN YOUR FEED</div>
  <div class="discs">
    <div class="disc" style="--c:#f28c1e"></div>
    <div class="disc" style="--c:#e8402a"></div>
    <div class="disc" style="--c:#8a4fd8"></div>
  </div>
  <div class="press">PRESS <span class="x">✕</span> TO PLAY</div>
  <div class="crt"></div>
</body>
</html>
